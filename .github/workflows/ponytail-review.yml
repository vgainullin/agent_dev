name: ponytail-review
# Reviews every pull request with Ponytail's /ponytail-review (AGENTS.md §0).
# Needs one repo secret: ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN. Without it the
# job skips with a notice instead of failing every PR.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: ponytail-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check for a key
        id: key
        env:
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [[ -n "$API_KEY$OAUTH" ]]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::No ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN secret; skipping review"; fi
      - if: steps.key.outputs.ok
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the review reads code around the diff, not only the diff
      - if: steps.key.outputs.ok
        uses: anthropics/claude-code-action@c9e0265e4e9aa1195ae7c2b862ec5abf6e3652a0  # v1.0.251
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/DietrichGebert/ponytail.git
          plugins: ponytail@ponytail
          use_sticky_comment: true
          prompt: |
            Run /ponytail-review on pull request #${{ github.event.pull_request.number }}
            in ${{ github.repository }}: the diff of this branch against
            origin/${{ github.event.pull_request.base.ref }}, reading the code it touches.
            Review against AGENTS.md. Post must-fix findings as inline comments and the
            full report as one PR comment. Do not edit files or push.
          claude_args: >-
            --max-turns 40
            --allowedTools "Skill,Read,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
