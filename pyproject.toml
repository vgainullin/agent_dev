[project]
name = "agent-dev"
version = "0.1.0"
description = "Rename me."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "hypothesis",
    "nbstripout",
    "pre-commit",
    "pyright",
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "NPY", "PT", "BLE", "S"]
ignore = ["S311"]  # non-crypto RNGs are the norm in scientific code

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers -m 'not slow'"
markers = ["slow: long-running; run with -m slow"]
testpaths = ["tests"]
